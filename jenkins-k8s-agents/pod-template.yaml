apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: maven
      image: maven:3.9.9-eclipse-temurin-21
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests: { cpu: "500m", memory: "1Gi" }
        limits: { cpu: "1", memory: "2Gi" }
      securityContext:
        allowPrivilegeEscalation: false
